name: Validate Mentro WebApp
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mentro
    env:
      LOCAL_PREVIEW: 'true'
      VITE_PROXY_URL: http://127.0.0.1:3001
      VITE_SUPABASE_URL: http://127.0.0.1:3004
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_local_fixture
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mentro/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
        if: ${{ !cancelled() }}
      - run: npm test
        if: ${{ !cancelled() }}
      - run: npm run build
        if: ${{ !cancelled() }}
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MENTRO_WEB_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: docker compose up --build --detach --wait --wait-timeout 60
      - run: node --test tests/http-smoke.test.mjs
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down
        if: always()
