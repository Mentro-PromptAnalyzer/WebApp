name: mentro-webapp-local
services:
  web:
    image: mentro-webapp-local:${MENTRO_WEB_REVISION:?Set MENTRO_WEB_REVISION to the tested commit}
    build:
      context: .
      args:
        VCS_REF: ${MENTRO_WEB_REVISION:?Set MENTRO_WEB_REVISION}
        LOCAL_PREVIEW: 'true'
        VITE_PROXY_URL: http://127.0.0.1:3001
        VITE_SUPABASE_URL: http://127.0.0.1:3004
        VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_local_fixture
    ports:
      - '127.0.0.1:8081:8080'
    user: '101:101'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    cpus: 0.5
    mem_limit: 128m
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
